<!-- No aria-live: a reading that changes every second would be announced every second. -->
<div id="countdown" class="countdown">
  <span id="line" class="line">
    <span id="prefix" class="prefix" data-ov-slot="prefix" hidden></span>
    <span id="value" class="value" data-ov-slot="value"></span>
  </span>
</div>
