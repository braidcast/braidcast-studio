<div id="deck" class="deck">
  <div id="deck-motion" class="deck-motion">
    <div id="deck-idle" class="deck-idle">
      <div id="deck-count" class="deck-count" aria-hidden="true"></div>
    </div>
  </div>
</div>
<div id="alert-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<template id="alert-card">
  <div class="alert" aria-hidden="true">
    <div class="alert-media"></div>
    <div class="alert-avatar"></div>
    <div class="alert-body">
      <div class="alert-name"></div>
      <div class="alert-msg"></div>
    </div>
  </div>
</template>
